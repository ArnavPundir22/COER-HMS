<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/coer-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COER Medical College of Ayurveda and Hospital — HMS</title>

    <!-- Progressive Web App (PWA) Meta & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COER HMS" />
    <link rel="apple-touch-icon" href="/coer-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ PWA Service Worker Registered:', reg.scope))
            .catch(err => console.warn('⚠️ PWA Service Worker Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
